<!DOCTYPE html>
<html>
<head>
    <title>Loan Approval Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="hero">
    <h1>🏦 Loan Approval Predictor</h1>
    <p>Machine Learning Based Loan Approval Prediction</p>
</div>

<div class="form-container">

    <form action="/predict" method="post">

        <h2>Loan Application Form</h2>

        <div class="grid">

            <div>
                <label>Number of Dependents</label>
                <select name="no_of_dependents">
                    <option>0</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </div>

            <div>
                <label>Education</label>
                <select name="education">
                    <option>Graduate</option>
                    <option>Not Graduate</option>
                </select>
            </div>

            <div>
                <label>Self Employed</label>
                <select name="self_employed">
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div>
                <label>Annual Income</label>
                <input type="number" name="income_annum" required>
            </div>

            <div>
                <label>Loan Amount</label>
                <input type="number" name="loan_amount" required>
            </div>

            <div>
                <label>Loan Term (Months)</label>
                <input type="number" name="loan_term" required>
            </div>

            <div>
                <label>CIBIL Score</label>
                <input type="number" name="cibil_score" required>
            </div>

            <div>
                <label>Residential Assets</label>
                <input type="number" name="residential_assets_value" required>
            </div>

            <div>
                <label>Commercial Assets</label>
                <input type="number" name="commercial_assets_value" required>
            </div>

            <div>
                <label>Luxury Assets</label>
                <input type="number" name="luxury_assets_value" required>
            </div>

            <div>
                <label>Bank Assets</label>
                <input type="number" name="bank_asset_value" required>
            </div>

        </div>

        <button type="submit">Predict Loan Approval</button>

    </form>

</div>

</body>
</html>
