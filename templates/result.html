<!DOCTYPE html>
<html>
<head>
<title>Prediction Result</title>

<style>

body{
    font-family:'Segoe UI';
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#061c3f,#0b4f9c);
}

.card{
    width:500px;
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.approved{
    color:#1db954;
}

.rejected{
    color:#e53935;
}

.icon{
    font-size:80px;
}

.btn{
    text-decoration:none;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    display:inline-block;
    margin:10px;
}

.back{
    background:#0b4f9c;
}

.admin{
    background:#222;
}

</style>

</head>
<body>

<div class="card">

{% if result == "Approved" %}

<div class="icon approved">✅</div>
<h1 class="approved">Loan Approved</h1>

{% else %}

<div class="icon rejected">❌</div>
<h1 class="rejected">Loan Rejected</h1>

{% endif %}

<p style="margin-top:15px;">
Your application has been processed successfully.
</p>

<br>

<a href="/" class="btn back">Apply Again</a>
<a href="/admin" class="btn admin">Dashboard</a>

</div>

</body>
</html>
